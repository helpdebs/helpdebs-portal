<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Play | help.debs</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#150a2e;--night2:#21124a;--deck:#2c1a5e;--ink:#1b1233;--paper:#fffaf2;
  --lime:#d7ff4f;--lime-d:#9fc81d;--pink:#ff5fa2;--pink-d:#c93478;--violet:#8b6bff;--violet-d:#5d3fd6;
  --sun:#ffb84d;--sun-d:#d9861a;--sky:#5fd3ff;--good:#3ddc84;--good-d:#1f9e57;--bad:#ff5c7a;--bad-d:#c22d4c;
  --muted:#b9acdf;--line:rgba(255,255,255,.12);
  --disp:"Bricolage Grotesque",Manrope,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:16px/1.5 Manrope,system-ui,sans-serif;color:#fff;min-height:100vh;overflow-x:hidden;
  background:
    radial-gradient(700px 420px at 15% -5%,rgba(139,107,255,.45),transparent 70%),
    radial-gradient(600px 400px at 100% 20%,rgba(255,95,162,.28),transparent 70%),
    radial-gradient(800px 500px at 50% 120%,rgba(95,211,255,.18),transparent 70%),
    var(--night)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.55) 1px,transparent 1.5px);background-size:44px 44px;
  mask-image:linear-gradient(180deg,#000,transparent 70%)}
h1,h2,h3{font-family:var(--disp);margin:0;letter-spacing:-.02em;line-height:1.05}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
.wrap{position:relative;max-width:720px;margin:0 auto;padding:18px 16px 90px}

/* topo */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font:800 18px var(--disp)}
.logo i{font-style:normal;background:var(--lime);color:var(--ink);border-radius:10px;padding:2px 8px;transform:rotate(-4deg);display:inline-block}
.topbtns{display:flex;gap:8px}
.ibtn{height:40px;min-width:40px;padding:0 12px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:800;font-size:14px;display:grid;place-items:center;color:#fff;text-decoration:none}
.ibtn:hover{background:rgba(255,255,255,.15)}

/* chunky 3D */
.chunk{position:relative;border-radius:18px;transition:transform .08s,box-shadow .08s;box-shadow:0 6px 0 var(--d,rgba(0,0,0,.35))}
.chunk:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--d,rgba(0,0,0,.35))}

/* player card */
.player{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--deck),var(--night2));border:1px solid var(--line);border-radius:26px;padding:16px;--d:#0b0520}
.avatar{width:84px;height:84px;flex-shrink:0;border-radius:24px;border:3px solid var(--lime);background-color:var(--violet);background-repeat:no-repeat;position:relative;transform:rotate(-3deg);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.avatar.letter{display:grid;place-items:center;font:800 36px var(--disp);color:var(--ink);background:var(--lime)}
.avatar .lvl{position:absolute;right:-10px;bottom:-10px;background:var(--pink);color:#fff;font:800 13px var(--disp);border-radius:10px;padding:3px 8px;transform:rotate(6deg);border:2px solid var(--night)}
.pinfo{flex:1;min-width:0}
.pinfo h1{font-size:28px}
.pinfo .role{font-size:13px;color:var(--muted);font-weight:700;margin:2px 0 10px}
.xp{height:14px;border-radius:10px;background:rgba(0,0,0,.35);overflow:hidden;position:relative}
.xp i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--lime),#f1ff9e);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.xpl{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted);margin-top:5px}
.badges{display:flex;gap:8px;margin:14px 0 22px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px}
.badge b{font:800 18px var(--disp)}
.badge.fire b{color:var(--sun)}
.badge.rev b{color:var(--pink)}
.badge.done b{color:var(--lime)}

.sec{font:800 13px Manrope;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.stages{display:grid;gap:16px}
.stage{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:18px;color:var(--ink);background:var(--bg);--d:var(--bd);overflow:hidden}
.stage::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.22)}
.stage .em{font-size:40px;width:64px;height:64px;flex-shrink:0;display:grid;place-items:center;background:rgba(255,255,255,.55);border-radius:20px;transform:rotate(-6deg)}
.stage h3{font-size:24px}
.stage p{margin:3px 0 0;font-size:14px;font-weight:700;opacity:.78}
.stage .tagxp{margin-left:auto;font:800 14px var(--disp);background:var(--ink);color:#fff;border-radius:12px;padding:6px 10px;white-space:nowrap;position:relative;z-index:1}
.stage.s1{--bg:var(--lime);--bd:var(--lime-d)}
.stage.s2{--bg:var(--sky);--bd:#2a9ccc}
.stage.s3{--bg:var(--pink);--bd:var(--pink-d);color:#fff}
.stage.s3 .em{background:rgba(255,255,255,.25)}
.stage:disabled{filter:grayscale(.7) brightness(.7);cursor:default}
.lock{position:relative;z-index:1;margin-left:auto;font:800 12px Manrope;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.35);color:#fff;border-radius:10px;padding:6px 10px;white-space:nowrap}
.emptybox{text-align:center;padding:30px 18px;border:2px dashed var(--line);border-radius:24px}
.emptybox .big{font-size:52px}

/* jogo */
.hud{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.quit{width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:18px;font-weight:800;flex-shrink:0}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:12px;border-radius:6px;background:rgba(255,255,255,.12);transition:background .3s}
.segs i.ok{background:var(--good)}
.segs i.no{background:var(--bad)}
.segs i.now{background:var(--lime);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.45}}
.score{font:800 18px var(--disp);color:var(--lime);min-width:56px;text-align:right}
.combo{display:inline-flex;align-items:center;gap:6px;font:800 14px var(--disp);color:var(--ink);background:var(--sun);border-radius:12px;padding:4px 10px;transform:rotate(-3deg);animation:pop .35s}
.combo.hot{background:linear-gradient(90deg,var(--sun),var(--pink));color:#fff}
.qcard{background:var(--paper);color:var(--ink);border-radius:28px;padding:24px 22px;position:relative;box-shadow:0 10px 0 #cfc3ff33,0 24px 60px rgba(0,0,0,.35);animation:enter .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes enter{from{transform:translateY(24px) scale(.97);opacity:0}}
.qtype{display:inline-block;font:800 12px Manrope;letter-spacing:.12em;text-transform:uppercase;background:var(--ink);color:var(--lime);padding:5px 10px;border-radius:10px;transform:rotate(-2deg);margin-bottom:14px}
.qhint{font-weight:700;color:#6c5f8f;margin:-4px 0 6px;font-size:14px}
.qtext{font:800 24px/1.25 var(--disp);margin:0 0 22px}
.qtext .blank{display:inline-block;min-width:80px;height:.9em;border-bottom:4px solid var(--violet);margin:0 4px;vertical-align:-2px}
.answers{display:grid;gap:12px}
.ans{display:flex;align-items:center;gap:12px;text-align:left;padding:15px 16px;background:#fff;border:2.5px solid #e7e0f7;color:var(--ink);font-weight:700;font-size:16px;--d:#e2d9f7}
.ans .k{width:30px;height:30px;flex-shrink:0;border-radius:9px;border:2px solid #e2d9f7;display:grid;place-items:center;font:800 13px Manrope;color:#9a8fbd}
.ans:hover:not(:disabled){border-color:var(--violet)}
.ans.right{background:#e6fbef;border-color:var(--good);--d:var(--good-d);color:#0f6b38;animation:pop .3s}
.ans.right .k{border-color:var(--good);color:var(--good-d)}
.ans.wrong{background:#ffe9ee;border-color:var(--bad);--d:var(--bad-d);color:#a51e3c;animation:shake .4s}
.ans:disabled{cursor:default}
.answers.tf{grid-template-columns:1fr 1fr}
.answers.tf .ans{justify-content:center;font:800 20px var(--disp);padding:22px}
@keyframes pop{50%{transform:scale(1.05)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.type{width:100%;font:700 18px Manrope;border:2.5px solid #e7e0f7;border-radius:18px;padding:16px;background:#fff;color:var(--ink)}
.type:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 4px #8b6bff22}
.type.right{border-color:var(--good);background:#e6fbef}
.type.wrong{border-color:var(--bad);background:#ffe9ee;animation:shake .4s}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tile{padding:9px 14px;border-radius:12px;background:#fff;border:2.5px solid #e7e0f7;font-weight:800;color:var(--ink);--d:#e2d9f7;box-shadow:0 4px 0 var(--d)}
.tile:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--d)}
.tile:disabled{opacity:.2;box-shadow:none}
.tray{min-height:68px;border-radius:18px;background:#f3eefe;border:2.5px dashed #d6caf7;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tray .tile{background:var(--violet);border-color:var(--violet);color:#fff;--d:var(--violet-d)}
.tray:empty::before{content:"Tap the words in order";color:#9a8fbd;font-weight:700;padding-left:6px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:grid;gap:10px;align-content:start}
.pairs .ans{font-size:14.5px;padding:12px;justify-content:center;text-align:center}
.pairs .ans.sel{border-color:var(--violet);background:#efe9ff}
.pairs .ans.done{opacity:.35;animation:none}
.cta{width:100%;margin-top:20px;padding:17px;font:800 18px var(--disp);background:var(--violet);color:#fff;--d:var(--violet-d)}
.cta:disabled{opacity:.4}

/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.9,.3,1.1)}
.sheet.show{transform:none}
.sheet .in{max-width:720px;margin:0 auto;border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom))}
.sheet.ok .in{background:#d9fbe7;color:#0d5c30}
.sheet.no .in{background:#ffe1e8;color:#8f1a35}
.sheet .row{display:flex;gap:14px;align-items:flex-start}
.sheet .face{width:58px;height:58px;flex-shrink:0;border-radius:18px;background-color:var(--violet);background-repeat:no-repeat;border:3px solid #fff;display:grid;place-items:center;font-size:28px}
.sheet h3{font-size:24px}
.sheet .say{font-weight:700;margin-top:2px}
.sheet .right-ans{margin-top:8px;background:#fff;color:var(--ink);border-radius:12px;padding:8px 12px;font-weight:800}
.sheet .exp{margin-top:8px;color:var(--ink);font-weight:600;font-size:15px}
.sheet .cta{margin-top:14px}
.sheet.ok .cta{background:var(--good);--d:var(--good-d)}
.sheet.no .cta{background:var(--bad);--d:var(--bad-d)}

/* +pts flutuante, confete */
.float{position:fixed;z-index:30;font:800 30px var(--disp);color:var(--lime);text-shadow:0 3px 0 var(--ink);pointer-events:none;animation:up 1s forwards}
@keyframes up{to{transform:translateY(-80px);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* resultado */
.result{text-align:center}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0 4px}
.stars span{font-size:58px;filter:grayscale(1) brightness(.4);transform:scale(.4);transition:.4s cubic-bezier(.2,.9,.3,1.6)}
.stars span.on{filter:none;transform:scale(1)}
.stars span:nth-child(2).on{transform:scale(1.25) translateY(-10px)}
.result h2{font-size:38px;margin:4px 0}
.result .sub{color:var(--muted);font-weight:700}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.rbox{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:18px;padding:14px 8px}
.rbox b{display:block;font:800 28px var(--disp)}
.rbox span{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.rbox.xpbox b{color:var(--lime)}
.levelup{display:inline-block;background:var(--pink);color:#fff;font:800 18px var(--disp);border-radius:14px;padding:8px 16px;transform:rotate(-3deg);margin-top:8px;animation:pop .6s 2}
.review{text-align:left;background:var(--paper);color:var(--ink);border-radius:24px;padding:18px;margin-top:6px}
.review h3{font-size:20px;margin-bottom:6px}
.rv{border-top:1.5px solid #ece5fb;padding:11px 0;font-size:15px}
.rv .q{font-weight:800}
.rv .a{color:var(--good-d);font-weight:800}
.rv .e{color:#6c5f8f;font-size:14px}
.btnrow{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;margin-top:20px}
.btn2{padding:16px;font:800 17px var(--disp);background:rgba(255,255,255,.1);border:1px solid var(--line);color:#fff;--d:rgba(0,0,0,.4)}
.btn3{padding:16px;font:800 17px var(--disp);background:var(--lime);color:var(--ink);--d:var(--lime-d)}
.loading{text-align:center;padding:90px 0;font:800 22px var(--disp);color:var(--muted)}
.loading span{display:inline-block;animation:bounce .6s infinite alternate}
@keyframes bounce{to{transform:translateY(-12px)}}
@media(max-width:520px){.pinfo h1{font-size:24px}.avatar{width:72px;height:72px}.stage{padding:15px}.stage h3{font-size:21px}.stage .em{width:54px;height:54px;font-size:32px}.qtext{font-size:21px}.tagxp{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="wrap">
  <div class="top" id="top">
    <a class="logo" href="portal.html">help<i>.debs</i> <span style="font-size:13px;color:var(--muted);font-family:Manrope">play</span></a>
    <div class="topbtns"><button class="ibtn" id="sndBtn" onclick="toggleSound()" aria-label="Som">🔊</button><a class="ibtn" href="portal.html">Portal</a></div>

  <main id="app"><div class="loading"><span>🎮</span><br>Loading…</div></main>
</div>

<script>
const SB_URL="https://pgdanuifukzisyyummpz.supabase.co";
const SB_ANON="sb_publishable_81NM6F08rsXXSCgjWl4iSg_v99cdVpo";
const sb=window.supabase.createClient(SB_URL,SB_ANON,{auth:{storageKey:'helpdebs-portal-auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

const PERIODO_DIAS=30;
const TIPO_LABEL={multiple_choice:"Pick one",fill_blank:"Fill the gap",match:"Match it",unscramble:"Build the sentence",true_false:"True or false?",translate_pt_en:"Say it in English",spot_the_mistake:"Spot the mistake",sounds_natural:"Which sounds natural?"};
/* personagens do teste de personalidade (rosto recortado de personagens_helpdebs.png) */
const CHARS={
  "A Analítica":{x:328,y:185,em:"🔍"}, "A Protagonista":{x:690,y:222,em:"🎤"}, "A Estudiosa":{x:920,y:222,em:"📖"},
  "A Camaleão":{x:1175,y:165,em:"🎭"}, "A Tranquila":{x:375,y:600,em:"🌊"}, "A Obstinada":{x:1335,y:440,em:"🔥"}
};
const IMG="personagens_helpdebs.png",IMG_W=1535,IMG_H=1024,FACE=170;
const PRAISE=["Say less. You nailed it.","Clean. Next one.","That's the one.","Look at you go.","Exactly right.","Smooth.","Too easy for you."];
const NUDGE=["Almost there. Here's the one:","Close! Check this out:","Not this time. Look:","Good try. Here's the answer:"];

const G={user:null,profile:null,packs:[],acts:[],answers:[],rounds:[],round:null,sound:true};
try{G.sound=localStorage.getItem("hd_snd")!=="0"}catch(e){}
const $=id=>document.getElementById(id);
const app=()=>$("app");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const norm=s=>String(s??"").toLowerCase().normalize("NFKC").replace(/[’‘`]/g,"'").replace(/[“”]/g,'"').replace(/[.,!?;:"()]/g," ").replace(/\s+/g," ").trim();
const CONTR=[["i'm","i am"],["you're","you are"],["it's","it is"],["don't","do not"],["doesn't","does not"],["didn't","did not"],["can't","cannot"],["won't","will not"],["isn't","is not"],["aren't","are not"],["i've","i have"],["i'd","i would"],["i'll","i will"],["that's","that is"],["there's","there is"],["let's","let us"],["wasn't","was not"],["haven't","have not"],["wouldn't","would not"],["couldn't","could not"],["shouldn't","should not"],["we're","we are"],["they're","they are"],["he's","he is"],["she's","she is"]];
const expand=s=>{let t=" "+norm(s)+" ";CONTR.forEach(([a,b])=>{t=t.split(" "+a+" ").join(" "+b+" ")});return t.trim().replace(/\bcan not\b/g,"cannot")};
const same=(a,b)=>expand(a)===expand(b);
const key=(packId,itemId)=>packId+":"+itemId;

/* ---------- XP e nível ---------- */
const xpFor=L=>50*L*(L-1);              // nível 2 = 100xp, 3 = 300xp, 4 = 600xp...
const levelOf=xp=>{let L=1;while(xp>=xpFor(L+1))L++;return L};
const totalXP=()=>G.rounds.reduce((s,r)=>s+(r.score||0),0);
function dayStreak(){
  const days=new Set(G.rounds.filter(r=>r.finished_at).map(r=>new Date(r.finished_at).toLocaleDateString("en-CA")));
  let n=0,d=new Date();
  if(!days.has(d.toLocaleDateString("en-CA")))d.setDate(d.getDate()-1);
  while(days.has(d.toLocaleDateString("en-CA"))){n++;d.setDate(d.getDate()-1)}
  return n;
}

/* ---------- avatar ---------- */
function faceStyle(size){
  const c=CHARS[G.profile.learning_profile];if(!c)return null;
  const s=size/FACE;
  return `background-image:url(${IMG});background-size:${IMG_W*s}px ${IMG_H*s}px;background-position:${-(c.x*s-size/2)}px ${-(c.y*s-size/2)}px`;
}
function avatarHTML(size,cls="avatar",inner=""){
  const st=faceStyle(size);
  if(st)return `<div class="${cls}" style="${st}">${inner}</div>`;
  const n=(G.profile.full_name||"?").trim()[0]||"?";
  return `<div class="${cls} letter">${esc(n.toUpperCase())}${inner}</div>`;
}

/* ---------- som ---------- */
let AC=null;
function beep(notes){
  if(!G.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    notes.forEach(([f,t,d,type])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||"triangle";o.frequency.value=f;
      g.gain.setValueAtTime(.0001,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.18,AC.currentTime+t+.01);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+d);
      o.connect(g).connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d+.02)});
  }catch(e){}
}
const SFX={ok:()=>beep([[660,0,.12],[990,.08,.18]]),no:()=>beep([[220,0,.18,"sawtooth"],[180,.1,.22,"sawtooth"]]),tap:()=>beep([[520,0,.05]]),
  combo:()=>beep([[660,0,.08],[880,.07,.08],[1175,.14,.2]]),win:()=>beep([[523,0,.12],[659,.12,.12],[784,.24,.12],[1047,.36,.35]])};
function toggleSound(){G.sound=!G.sound;try{localStorage.setItem("hd_snd",G.sound?"1":"0")}catch(e){}$("sndBtn").textContent=G.sound?"🔊":"🔇";if(G.sound)SFX.tap()}
$("sndBtn").textContent=G.sound?"🔊":"🔇";

/* ---------- efeitos ---------- */
function floatPts(txt,el){
  const r=(el||document.body).getBoundingClientRect(),f=document.createElement("div");
  f.className="float";f.textContent=txt;f.style.left=(r.left+r.width/2-30)+"px";f.style.top=(r.top+(el?0:r.height/3))+"px";
  document.body.appendChild(f);setTimeout(()=>f.remove(),1000);
}
function confetti(n=60){
  const box=document.createElement("div");box.className="confetti";
  const cols=["#d7ff4f","#ff5fa2","#8b6bff","#5fd3ff","#ffb84d"];
  for(let i=0;i<n;i++){const c=document.createElement("i");c.style.left=Math.random()*100+"%";c.style.background=pickOne(cols);
    c.style.animationDuration=(1.6+Math.random()*1.6)+"s";c.style.animationDelay=Math.random()*.4+"s";c.style.transform=`rotate(${Math.random()*360}deg)`;box.appendChild(c)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),3800);
}

/* ---------- boot ---------- */
(async function(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){location.href="login.html";return}
  G.user=session.user;
  const prof=await sb.from("profiles").select("*").eq("id",G.user.id).maybeSingle();
  G.profile=prof.data||{};
  await loadData();
  home();
})();

async function loadData(){
  const p=await sb.from("game_packs").select("id,titulo,tema,nivel,pack,published_at").eq("student_id",G.user.id).eq("status","published").order("published_at",{ascending:false});
  G.packs=p.data||[];
  if(G.packs.length){
    const a=await sb.from("game_activities").select("id,pack_id,tipo,item_ids,data").in("pack_id",G.packs.map(x=>x.id));
    G.acts=(a.data||[]).map(r=>({...r.data,id:r.id,pack_id:r.pack_id,tipo:r.tipo,item_ids:r.item_ids||[]}));
  }
  const ans=await sb.from("game_answers").select("item_ids,correta,created_at").eq("student_id",G.user.id).order("created_at",{ascending:false}).limit(1000);
  G.answers=ans.data||[];
  const rr=await sb.from("game_rounds").select("score,finished_at,modo").eq("student_id",G.user.id).order("started_at",{ascending:false}).limit(1000);
  G.rounds=rr.data||[];
}

/* ---------- histórico por item ---------- */
function itemStats(){
  const st={};
  G.answers.forEach(a=>(a.item_ids||[]).forEach(k=>{
    st[k]=st[k]||{ok:0,err:0,last:null};
    a.correta?st[k].ok++:st[k].err++;
    if(!st[k].last||a.created_at>st[k].last)st[k].last=a.created_at;
  }));
  return st;
}
function priorityIds(pack){
  const p=pack.pack||{};
  return new Set(["vocabulario","estruturas","expressoes"].flatMap(k=>(p[k]||[]).filter(i=>i.prioritario).map(i=>i.id)));
}

/* ---------- montagem das rodadas ---------- */
function orderNoRepeat(list){
  const out=[];let pool=shuffle(list);
  while(pool.length){
    const bad=out.length>=2&&out[out.length-1].tipo===out[out.length-2].tipo?out[out.length-1].tipo:null;
    let i=pool.findIndex(a=>a.tipo!==bad);if(i<0)i=0;
    out.push(pool.splice(i,1)[0]);
  }
  return out;
}
function buildUltimaAula(){
  const pack=G.packs[0];
  const acts=G.acts.filter(a=>a.pack_id===pack.id);
  const n=Math.min(acts.length,12);
  const prio=priorityIds(pack);
  const covered=new Set(),chosen=[];
  let pool=shuffle(acts);
  const score=a=>a.item_ids.filter(i=>!covered.has(i)).reduce((s,i)=>s+(prio.has(i)?3:1),0)+(a.item_ids.some(i=>prio.has(i))?0.5:0);
  while(chosen.length<n&&pool.length){
    pool.sort((x,y)=>score(y)-score(x));
    const a=pool.shift();chosen.push(a);a.item_ids.forEach(i=>covered.add(i));
  }
  return {acts:orderNoRepeat(chosen),packIds:[pack.id]};
}
function buildPeriodo(){
  const since=Date.now()-PERIODO_DIAS*864e5;
  const packs=G.packs.filter(p=>new Date(p.published_at).getTime()>=since);
  const ids=new Set(packs.map(p=>p.id));
  const acts=G.acts.filter(a=>ids.has(a.pack_id));
  const n=Math.min(acts.length,Math.max(15,Math.min(20,packs.length*5)));
  const st=itemStats();
  const prio={};packs.forEach(p=>prio[p.id]=priorityIds(p));
  const isPrio=a=>prio[a.pack_id]&&a.item_ids.some(i=>prio[a.pack_id].has(i));
  const errScore=a=>Math.max(0,...a.item_ids.map(i=>{const s=st[key(a.pack_id,i)];return s?(s.err-s.ok*0.5):0}));
  const ageScore=a=>Math.max(0,...a.item_ids.map(i=>{const s=st[key(a.pack_id,i)];return s?.last?(Date.now()-new Date(s.last))/864e5:999}))+(isPrio(a)?5:0);
  const pick=(list,k,used)=>{const r=[];for(const a of list){if(r.length>=k)break;if(!used.has(a.id)){r.push(a);used.add(a.id)}}return r};
  const used=new Set();
  const byErr=shuffle(acts).filter(a=>errScore(a)>0).sort((x,y)=>errScore(y)-errScore(x));
  const byAge=shuffle(acts).sort((x,y)=>ageScore(y)-ageScore(x));
  let chosen=[...pick(byErr,Math.round(n*.4),used),...pick(byAge,Math.round(n*.3),used)];
  packs.forEach(p=>{const have=chosen.filter(a=>a.pack_id===p.id).length;if(have<2)chosen.push(...pick(shuffle(acts.filter(a=>a.pack_id===p.id)),2-have,used))});
  chosen.push(...pick(shuffle(acts),n-chosen.length,used));
  return {acts:orderNoRepeat(chosen.slice(0,n)),packIds:packs.map(p=>p.id)};
}

/* ---------- rodada ---------- */
async function start(modo){
  SFX.tap();
  const r=modo==="ultima_aula"?buildUltimaAula():buildPeriodo();
  if(!r.acts.length){alert("This class has no activities yet.");return}
  G.round={modo,acts:r.acts,i:0,points:0,streak:0,best:0,right:0,misses:[],results:[],id:null,answered:false,xpBefore:totalXP()};
  const ins=await sb.from("game_rounds").insert({student_id:G.user.id,modo,pack_ids:r.packIds,total:r.acts.length}).select("id").single();
  if(!ins.error)G.round.id=ins.data.id;
  $("top").style.display="none";
  renderAct();
}
function quitRound(){
  if(!confirm("Leave this round? Your answers so far are saved."))return;
  hideSheet();G.round=null;home();
}
function hud(){
  const R=G.round;
  return `<div class="hud"><button class="quit" onclick="quitRound()" aria-label="Sair">✕</button>
    <div class="segs">${R.acts.map((_,k)=>`<i class="${k<R.i?(R.results[k]?"ok":"no"):k===R.i?"now":""}"></i>`).join("")}</div>
    <span class="score" id="score">${R.points}</span></div>
    ${R.streak>=2?`<div style="margin:-6px 0 12px"><span class="combo ${R.streak>=5?"hot":""}">🔥 COMBO ×${R.streak}</span></div>`:""}`;
}
function renderAct(){
  const R=G.round,a=R.acts[R.i];R.answered=false;R.state={};
  const L="ABCD";
  const choices=(list,cls="")=>`<div class="answers ${cls}">${list.map((o,k)=>`<button class="ans chunk" data-v="${esc(o)}" onclick="choose(this)">${cls?"":`<span class="k">${L[k]||k+1}</span>`}<span>${esc(o)}</span></button>`).join("")}</div>`;
  let body="",cta=false;
  switch(a.tipo){
    case "multiple_choice": body=q(a.enunciado)+choices(shuffle(a.opcoes||[]));break;
    case "sounds_natural": body=q(a.enunciado||"Which one sounds more natural?")+choices(shuffle(a.opcoes||[]));break;
    case "true_false": body=q(a.enunciado)+choices(["True","False"],"tf");break;
    case "fill_blank": cta=true;
      body=q(a.enunciado,true)+`<input class="type" id="ans" autocomplete="off" autocapitalize="off" placeholder="Type the missing part" onkeydown="if(event.key==='Enter')check()">`
        +(a.banco?.length?`<div class="tiles">${shuffle(a.banco).map(w=>`<button class="tile" data-w="${esc(w)}" onclick="SFX.tap();$('ans').value=this.dataset.w">${esc(w)}</button>`).join("")}</div>`:"");break;
    case "translate_pt_en": cta=true;
      body=`<p class="qhint">🇧🇷 → 🇺🇸</p>`+q(a.enunciado)+`<input class="type" id="ans" autocomplete="off" placeholder="Type it in English" onkeydown="if(event.key==='Enter')check()">`;break;
    case "spot_the_mistake": cta=true;
      body=`<p class="qhint">Something's off. Fix the sentence 👇</p>`+q(a.enunciado)+`<input class="type" id="ans" autocomplete="off" value="${esc(a.enunciado)}" onkeydown="if(event.key==='Enter')check()">`;break;
    case "unscramble": cta=true;
      R.state.words=shuffle((a.palavras&&a.palavras.length?a.palavras:String(a.resposta_correta).split(/\s+/)).map((w,k)=>({w,k})));R.state.built=[];
      body=q(a.enunciado||"Put the words in order.")+`<div class="tray" id="tray"></div><div class="tiles" id="pool"></div>`;break;
    case "match":{
      const pares=(a.pares||[]).map(p=>Array.isArray(p)?p:[p.a??p.left,p.b??p.right]);
      R.state={pares,sel:null,done:{},errors:0};
      body=q(a.enunciado||"Match the pairs.")+`<div class="pairs"><div class="col">${pares.map((p,k)=>`<button class="ans chunk" id="L${k}" onclick="mPick('L',${k})">${esc(p[0])}</button>`).join("")}</div><div class="col">${shuffle(pares.map((p,k)=>({t:p[1],k}))).map(o=>`<button class="ans chunk" id="R${o.k}" onclick="mPick('R',${o.k})">${esc(o.t)}</button>`).join("")}</div></div>`;break;}
    default: body=q(a.enunciado);
  }
  app().innerHTML=hud()+`<div class="qcard"><span class="qtype">${TIPO_LABEL[a.tipo]||a.tipo}</span>${body}
    ${cta?`<button class="cta chunk" id="checkBtn" onclick="check()">Check</button>`:""}</div>`;
  if(a.tipo==="unscramble")paintUnscramble();
  if($("ans")&&window.innerWidth>700)$("ans").focus();
}
function q(t,blank){
  let h=esc(t||"");
  if(blank)h=h.replace(/_{2,}/g,'<span class="blank"></span>');
  return `<p class="qtext">${h}</p>`;
}
document.addEventListener("keydown",e=>{
  if(!G.round||document.activeElement?.tagName==="INPUT")return;
  if(e.key==="Enter"&&$("sheet").classList.contains("show")){next();return}
  const i="1234abcd".indexOf(e.key.toLowerCase());
  if(i>=0&&!G.round.answered){const btns=document.querySelectorAll(".answers .ans");const b=btns[i%4];if(b)b.click()}
});
function choose(btn){
  const R=G.round,a=R.acts[R.i];if(R.answered)return;
  const isRight=v=>a.tipo==="true_false"?norm(v)===norm(a.resposta_correta):same(v,a.resposta_correta);
  const correct=isRight(btn.dataset.v);
  document.querySelectorAll(".answers .ans").forEach(b=>{b.disabled=true;
    if(isRight(b.dataset.v))b.classList.add("right");else if(b===btn)b.classList.add("wrong")});
  finish(correct,btn.dataset.v,btn);
}
function check(){
  const R=G.round,a=R.acts[R.i];if(R.answered)return;
  let v,correct;
  if(a.tipo==="unscramble"){
    v=R.state.built.map(x=>x.w).join(" ");if(!v)return;
    correct=same(v,a.resposta_correta);
    $("tray").style.borderColor=correct?"var(--good)":"var(--bad)";
  }else{
    v=$("ans").value.trim();if(!v){$("ans").focus();return}
    correct=[a.resposta_correta,...(a.respostas_aceitas||[])].filter(Boolean).some(x=>same(v,x));
    $("ans").disabled=true;$("ans").classList.add(correct?"right":"wrong");
  }
  if($("checkBtn"))$("checkBtn").style.display="none";
  finish(correct,v,$("ans")||$("tray"));
}
function paintUnscramble(){
  const S=G.round.state,used=new Set(S.built.map(x=>x.k));
  $("tray").innerHTML=S.built.map((x,i)=>`<button class="tile" onclick="unPick(${i})">${esc(x.w)}</button>`).join("");
  $("pool").innerHTML=S.words.map(x=>`<button class="tile" ${used.has(x.k)?"disabled":""} onclick="unAdd(${x.k})">${esc(x.w)}</button>`).join("");
}
function unAdd(k){const S=G.round.state;if(G.round.answered)return;SFX.tap();S.built.push(S.words.find(x=>x.k===k));paintUnscramble()}
function unPick(i){if(G.round.answered)return;G.round.state.built.splice(i,1);paintUnscramble()}
function mPick(side,k){
  const R=G.round,S=R.state;if(R.answered)return;
  if(side==="L"&&k in S.done||side==="R"&&Object.values(S.done).includes(k))return;
  SFX.tap();
  if(!S.sel||S.sel.side===side){
    document.querySelectorAll(".pairs .sel").forEach(b=>b.classList.remove("sel"));
    S.sel={side,k};$(side+k).classList.add("sel");return;
  }
  const l=side==="L"?k:S.sel.k,r=side==="R"?k:S.sel.k;
  document.querySelectorAll(".pairs .sel").forEach(b=>b.classList.remove("sel"));S.sel=null;
  if(l===r){S.done[l]=r;["L"+l,"R"+r].forEach(id=>{$(id).classList.add("right");setTimeout(()=>{$(id).classList.add("done");$(id).disabled=true},350)});}
  else{S.errors++;SFX.no();[$("L"+l),$("R"+r)].forEach(b=>{b.classList.add("wrong");setTimeout(()=>b.classList.remove("wrong"),450)});}
  if(Object.keys(S.done).length===S.pares.length)setTimeout(()=>finish(S.errors===0,`${S.errors} erro(s)`,document.querySelector(".pairs"),S.errors),300);
}
function finish(correct,given,el,matchErrors){
  const R=G.round,a=R.acts[R.i];R.answered=true;R.results[R.i]=!!correct;
  let gain=0,bonus=0;
  if(correct){R.streak++;R.right++;R.best=Math.max(R.best,R.streak);
    bonus=R.streak===3?5:R.streak===5?10:R.streak===10?20:0;gain=10+bonus;
    (bonus?SFX.combo:SFX.ok)();if(R.streak===5||R.streak===10)confetti(40);}
  else{R.streak=0;R.misses.push(a);SFX.no();if(a.tipo==="match"&&matchErrors<=1)gain=5;}
  R.points+=gain;
  if(gain){floatPts("+"+gain,el);const s=$("score");if(s)s.textContent=R.points}
  const answerText=a.tipo==="match"?"":a.tipo==="true_false"?(norm(a.resposta_correta)==="true"?"True":"False"):a.resposta_correta;
  const face=faceStyle(58);
  const title=correct?(bonus?`Combo ×${R.streak}! +${bonus}`:"Nice!"):a.tipo==="match"?`Done · ${matchErrors} slip${matchErrors>1?"s":""}`:"Oops!";
  $("sheet").className="sheet "+(correct?"ok":"no");
  $("sheetIn").innerHTML=`<div class="row">${face?`<div class="face" style="${face}"></div>`:`<div class="face">${correct?"😎":"🤏"}</div>`}
    <div style="flex:1"><h3>${title}</h3><div class="say">${correct?pickOne(PRAISE):pickOne(NUDGE)}</div>
    ${!correct&&answerText?`<div class="right-ans">✓ ${esc(answerText)}</div>`:""}
    ${a.explicacao?`<div class="exp">${esc(a.explicacao)}</div>`:""}</div></div>
    <button class="cta chunk" onclick="next()">${R.i+1<R.acts.length?"Continue":"See my score"}</button>`;
  requestAnimationFrame(()=>$("sheet").classList.add("show"));
  if(R.id)sb.from("game_answers").insert({round_id:R.id,activity_id:a.id,student_id:G.user.id,item_ids:a.item_ids.map(i=>key(a.pack_id,i)),resposta:String(given??"").slice(0,500),correta:!!correct}).then(({error})=>{if(error)console.warn(error)});
  G.answers.unshift({item_ids:a.item_ids.map(i=>key(a.pack_id,i)),correta:!!correct,created_at:new Date().toISOString()});
}
function hideSheet(){$("sheet").classList.remove("show")}
function next(){
  hideSheet();
  const R=G.round;R.i++;
  if(R.i<R.acts.length){setTimeout(()=>{renderAct();window.scrollTo({top:0,behavior:"smooth"})},120);return}
  setTimeout(results,150);
}
async function results(){
  const R=G.round,acc=R.right/R.acts.length;
  const stars=acc>=.9?3:acc>=.7?2:acc>=.4?1:0;
  const xpGain=R.points+stars*10;
  if(R.id)await sb.from("game_rounds").update({score:xpGain,total:R.acts.length,finished_at:new Date().toISOString()}).eq("id",R.id);
  G.rounds.unshift({score:xpGain,finished_at:new Date().toISOString(),modo:R.modo});
  const Lb=levelOf(R.xpBefore),La=levelOf(R.xpBefore+xpGain);
  const head=["Let's run it back.","Getting there!","Great round!","Flawless!"][stars];
  app().innerHTML=`
  <div class="result">
    <div class="stars">${[1,2,3].map(n=>`<span id="st${n}">⭐</span>`).join("")}</div>
    <h2>${head}</h2>
    <div class="sub">${R.modo==="ultima_aula"?"Quick review":"Month mix"} · ${R.right}/${R.acts.length} correct</div>
    ${La>Lb?`<div class="levelup">LEVEL UP! → ${La}</div>`:""}
    <div class="rgrid">
      <div class="rbox xpbox"><b id="xpcount">+0</b><span>XP</span></div>
      <div class="rbox"><b>${Math.round(acc*100)}%</b><span>accuracy</span></div>
      <div class="rbox"><b>${R.best}</b><span>best combo</span></div>
    </div>
    ${R.misses.length?`<div class="review"><h3>🧠 Save these for later</h3>${R.misses.map(a=>`<div class="rv"><div class="q">${esc(a.enunciado)}</div>${a.tipo!=="match"?`<div class="a">✓ ${esc(a.tipo==="true_false"?(norm(a.resposta_correta)==="true"?"True":"False"):a.resposta_correta)}</div>`:""}${a.explicacao?`<div class="e">${esc(a.explicacao)}</div>`:""}</div>`).join("")}</div>`:""}
    <div class="btnrow"><button class="btn2 chunk" onclick="home()">Lobby</button><button class="btn3 chunk" onclick="start('${R.modo}')">Play again</button></div>
  </div>`;
  window.scrollTo({top:0,behavior:"smooth"});
  for(let n=1;n<=stars;n++)setTimeout(()=>{$("st"+n)?.classList.add("on");beep([[600+n*150,0,.15]])},300+n*350);
  setTimeout(()=>{if(stars>=2||La>Lb){SFX.win();confetti(stars===3?120:60)}},300+stars*350+100);
  let c=0;const step=Math.max(1,Math.round(xpGain/30));const t=setInterval(()=>{c=Math.min(xpGain,c+step);if($("xpcount"))$("xpcount").textContent="+"+c;if(c>=xpGain)clearInterval(t)},30);
  G.round=null;
}
</script>
