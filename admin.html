<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    body {
      background: #0b0b12;
      color: white;
      font-family: Arial;
    }
    .box {
      padding: 20px;
      margin: 20px;
      border: 1px solid #333;
      border-radius: 12px;
    }
  </style>
</head>

<body>

<h1>Dashboard</h1>

<div class="box">
  <h2>Notificações</h2>
  <div id="notifications"></div>
</div>

<script>
const SUPABASE_URL = "https://pgdanuifukzisyyummpz.supabase.co";
const SUPABASE_KEY = "sb_publishable_81NM6F08rsXXSCgjWl4iSg_v99cdVpo";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function carregarNotificacoes() {
  const { data, error } = await sb
    .from("notifications")
    .select("*")
    .order("created_at", { ascending: false });

  const el = document.getElementById("notifications");

  if (error) {
    el.innerHTML = "erro";
    console.log(error);
    return;
  }

  if (!data || data.length === 0) {
    el.innerHTML = "nenhuma notificação";
    return;
  }

  el.innerHTML = "";

  data.forEach(n => {
    const div = document.createElement("div");
    div.style.marginBottom = "10px";

    div.innerHTML = `
      <strong>${n.message}</strong><br>
      <small>${new Date(n.created_at).toLocaleString()}</small>
    `;

    el.appendChild(div);
  });
}

/* 🔥 ATUALIZA AUTOMATICAMENTE */
setInterval(carregarNotificacoes, 2000);

/* 🔥 CARREGA AO ABRIR */
carregarNotificacoes();

</script>

</body>
</html>
